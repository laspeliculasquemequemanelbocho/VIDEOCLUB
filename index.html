<script>
/* ===== CATÁLOGO =====
   Para agregar una cinta, copiá una línea y completá:
   t = título, a = año, d = director, c = estante, u = link para ver,
   n = nota (párrafos separados por una línea en blanco: \n\n)
   Estantes: "Cine argentino", "Cine latinoamericano", "Policial y noir", "Hollywood", "Europa", "Japón", "Terror y culto"

const ESTANTES = {
  "Cine argentino": "#a3262c",
  "Cine latinoamericano": "#2f6f73",
  "Policial y noir": "#6f6c66",

function plataforma(url) {
  if (!url) return "el link";
  if (url.includes("ok.ru")) return "ok.ru";
  if (url.includes("youtube") || url.includes("youtu.be")) return "YouTube";
  if (url.includes("cine.ar")) return "Cine.ar";
  if (url.includes("vk.com") || url.includes("vkvideo.ru")) return "VK";
  if (url.includes("archive.org")) return "Archive.org";
  if (url.includes("vimeo.com")) return "Vimeo";
  if (url.includes("legalmentegratis")) return "legalmentegratis";
  return "el link";
}

const $ = (id) => document.getElementById(id);
const inputBuscar = $("buscar");
const estante = $("estante");

function crearCinta(p) {
  const art = document.createElement("article");
  art.className = "cinta";
  art.style.setProperty("--tono", ESTANTES[p.c] || "var(--blood)");

  const afiche = document.createElement("div");
  afiche.className = "afiche";
  if (p.p) afiche.style.setProperty("--poster", 'url("' + p.p + '")');

  const h = document.createElement("h3");
  h.className = "titulo";
  h.textContent = p.t;

  const pie = document.createElement("div");
  pie.className = "pie-portada";
  const cat = document.createElement("p");
  cat.className = "cat";
  cat.textContent = p.c;
  const meta = document.createElement("p");
  meta.className = "meta";
  meta.textContent = p.d + " · " + p.a;
  pie.append(meta);
  afiche.append(h, pie);

  /* La carátula también abre la ficha con el reproductor */
  afiche.tabIndex = 0;
  afiche.setAttribute("role", "button");
  afiche.setAttribute("aria-label", "Ver " + p.t + " dentro de la página");
  afiche.addEventListener("click", () => abrirAmpliada(p, afiche));
  afiche.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrirAmpliada(p, afiche); }
  });

  /* Casete VHS con etiqueta */
  const casete = document.createElement("div");
  casete.className = "casete";
  casete.setAttribute("aria-hidden", "true");
  const sticker = document.createElement("span");
  sticker.className = "sticker";
  sticker.textContent = p.t + " · " + p.a;
  const ventana = document.createElement("span");
  ventana.className = "ventana";
  casete.append(sticker, ventana);

  const cuerpo = document.createElement("div");
  cuerpo.className = "cuerpo";

  if (p.n) {
    const nota = document.createElement("details");
    nota.className = "nota";
    const resumen = document.createElement("summary");
    resumen.textContent = "Leer la nota";
    const texto = document.createElement("div");
    texto.className = "texto";
    p.n.split("\n\n").forEach((parrafo) => {
      const e = document.createElement("p");
      e.textContent = parrafo;
      texto.appendChild(e);
    });
    nota.append(resumen, texto);
    cuerpo.appendChild(nota);
  }

  const btnVer = document.createElement("button");
  btnVer.type = "button";
  btnVer.className = "ver";
  btnVer.textContent = "▶ Ver película";
  btnVer.setAttribute("aria-label", "Ver " + p.t + " dentro de la página");
  btnVer.addEventListener("click", () => abrirAmpliada(p, btnVer));

  const ampliar = document.createElement("button");
  ampliar.type = "button";
  ampliar.className = "ampliar";
  ampliar.textContent = "Ficha y nota";
  ampliar.setAttribute("aria-label", "Ampliar la ficha de " + p.t);
  ampliar.addEventListener("click", () => abrirAmpliada(p, ampliar));

  cuerpo.append(ampliar, btnVer);
  art.append(afiche, casete, cuerpo);
  return art;
}

/* Convierte el link de la ficha en su versión incrustable (YouTube, Ok.ru, VK, Archive, Vimeo).
   Devuelve null si el sitio bloquea la incrustación (play.cine.ar, legalmentegratis, etc.). */
function urlIncrustable(url) {
  if (!url) return null;
  let m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return "https://www.youtube-nocookie.com/embed/" + m[1] + "?autoplay=1&rel=0";

  m = url.match(/ok\.ru\/(?:video|videoembed|live)\/(\d+)/);
  if (m) return "https://ok.ru/videoembed/" + m[1] + "?autoplay=1";

  m = url.match(/(?:vk\.com|vkvideo\.ru)\/video(-?\d+)_(\d+)/);
  if (m) return "https://vk.com/video_ext.php?oid=" + m[1] + "&id=" + m[2] + "&hd=2&autoplay=1";

  m = url.match(/archive\.org\/(?:details|embed)\/([^/?#]+)/);
  if (m) return "https://archive.org/embed/" + m[1] + "?autoplay=1";

  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return "https://player.vimeo.com/video/" + m[1] + "?autoplay=1";

  return null;
}

/* Reproductor de #ampliada: iframe responsive, o pantalla retro si el sitio bloquea iframes */
function crearReproductor(p) {
  const url = p.v || p.u;
  const src = urlIncrustable(url);
  const cont = document.createElement("div");
  if (src) {
    cont.className = "dlg-video";
    cont.setAttribute("data-calidad", "Calidad: usá el ⚙ del reproductor para mejorarla");
    const frame = document.createElement("iframe");
    frame.src = src;
    frame.title = "Reproductor: " + p.t;
    frame.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
    frame.setAttribute("allowfullscreen", "");
    cont.appendChild(frame);
  } else {
    cont.className = "dlg-externo";
    if (p.p) {
      cont.style.backgroundImage = 'linear-gradient(rgba(7,4,5,.82), rgba(7,4,5,.88)), url("' + p.p + '")';
      cont.style.backgroundSize = "cover";
      cont.style.backgroundPosition = "center";
    }
    const aviso = document.createElement("p");
    aviso.textContent = plataforma(url) + " bloquea la reproducción incrustada por seguridad del sitio.";
    const boton = document.createElement("a");
    boton.className = "dlg-boton-retro";
    boton.href = url;
    boton.target = "_blank";
    boton.rel = "noopener noreferrer";
    boton.textContent = "▶ Abrir en " + plataforma(url);
    cont.append(aviso, boton);
  }
  return cont;
}

/* Apaga la música de fondo si estaba sonando (para dejar paso a la película) */
function silenciarMusica() {
  if (!sonando) return;
  clearInterval(reloj);
  sonando = false;
  botonMusica.textContent = "♪ Música";
  botonMusica.setAttribute("aria-pressed", "false");
}

function abrirAmpliada(p, disparador) {
  silenciarMusica();
  const dlg = $("ampliada");
  $("dlg-titulo").textContent = p.t;
  $("dlg-meta").textContent = p.d + " · " + p.a + " · " + p.c;

  const reproductor = $("dlg-reproductor");
  reproductor.replaceChildren(crearReproductor(p));

  const cuerpo = $("dlg-cuerpo");
  cuerpo.replaceChildren();
  (p.n || "Sin nota todavía.").split("\n\n").forEach((parrafo) => {
    const e = document.createElement("p");
    e.textContent = parrafo;
    cuerpo.appendChild(e);
  });

  const pie = $("dlg-pie");
  pie.replaceChildren();
  if (p.u && urlIncrustable(p.u)) {
    const enlace = document.createElement("a");
    enlace.className = "dlg-link-fuente";
    enlace.href = p.u;
    enlace.target = "_blank";
    enlace.rel = "noopener noreferrer";
    enlace.textContent = "Si no carga aquí, abrir en " + plataforma(p.u) + " ↗";
    pie.appendChild(enlace);
  }
  /* Director y año, a la derecha de la misma franja */
  const firma = document.createElement("span");
  firma.className = "dlg-firma";
  firma.textContent = p.d + " · " + p.a;
  pie.appendChild(firma);

  dlg.showModal();
  $("dlg-cerrar").onclick = () => dlg.close();
  dlg.onclose = () => {
    /* Al cerrar: vaciar el src del iframe para detener el audio/video */
    const frame = reproductor.querySelector("iframe");
    if (frame) frame.removeAttribute("src");
    reproductor.replaceChildren();
    pie.replaceChildren();
    disparador && disparador.focus();
  };
}

function render() {
  const q = inputBuscar.value.trim().toLowerCase();
  const filtradas = PELIS
    .filter((p) => !q || (p.t + " " + p.d).toLowerCase().includes(q))
    .sort((x, y) => x.t.localeCompare(y.t, "es"));

  estante.replaceChildren();
  filtradas.forEach((p) => estante.appendChild(crearCinta(p)));

  $("vacio").hidden = filtradas.length > 0;
  $("conteo").textContent = "Rebobiná la película";
}

/* ===== Música original que se transforma (no es de ninguna película ni obra) =====
   Empieza con pulso de sintetizador y, con el tiempo, suma pad, piano y bajos
   dramáticos, como un teatro de ópera que se va poniendo cada vez más intenso. */
const botonMusica = $("musica");
const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let maestro = null;
let reloj = null;
let inicio = 0;
let siguiente = 0;
let paso16 = 0;
let sonando = false;

/* Acordes en semitonos desde La2 (110 Hz): La menor, Fa, Mi, La menor */
const ACORDES = [[0, 3, 7], [-4, 0, 3], [-3, 1, 4], [0, 3, 7]];
const PASO = 0.16; /* paso lento, más solemne */

function frecuencia(semi) {
  return 110 * Math.pow(2, semi / 12);
}

/* Capa 1: pulso de sintetizador (siempre) */
function pulso(t, semi) {
  const osc = audioCtx.createOscillator();
  osc.type = "triangle";
  osc.frequency.value = frecuencia(semi - 12);
  const filtro = audioCtx.createBiquadFilter();
  filtro.type = "lowpass";
  filtro.frequency.value = 520;
  const vol = audioCtx.createGain();
  vol.gain.setValueAtTime(0.0001, t);
  vol.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
  vol.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  osc.connect(filtro);
  filtro.connect(vol);
  vol.connect(maestro);
  osc.start(t);
  osc.stop(t + 0.22);
}

/* Capa 2: pad de cuerdas (sinusoides lentas) */
function pad(t, acorde, dur) {
  acorde.forEach((semi) => {
    /* Dos cuerdas desafinadas apenas: suena a orquesta de cine de terror */
    [-7, 7].forEach((cents) => {
      const osc = audioCtx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.value = frecuencia(semi + 12);
      osc.detune.value = cents;
      const filtro = audioCtx.createBiquadFilter();
      filtro.type = "lowpass";
      filtro.frequency.value = 900;
      const vol = audioCtx.createGain();
      vol.gain.setValueAtTime(0.0001, t);
      vol.gain.exponentialRampToValueAtTime(0.02, t + 1.2);
      vol.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(filtro);
      filtro.connect(vol);
      vol.connect(maestro);
      osc.start(t);
      osc.stop(t + dur + 0.1);
    });
  });
}

/* Capa 3: piano (triángulo con caída rápida) */
function piano(t, semi, vol0) {
  const osc = audioCtx.createOscillator();
  osc.type = "triangle";
  osc.frequency.value = frecuencia(semi + 12);
  const vol = audioCtx.createGain();
  vol.gain.setValueAtTime(vol0, t);
  vol.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
  osc.connect(vol);
  vol.connect(maestro);
  osc.start(t);
  osc.stop(t + 2);
}

/* Capa 4: bajo dramático y tenso */
function bajo(t, semi) {
  const osc = audioCtx.createOscillator();
  osc.type = "sawtooth";
  osc.frequency.value = frecuencia(semi - 12);
  const filtro = audioCtx.createBiquadFilter();
  filtro.type = "lowpass";
  filtro.frequency.value = 300;
  const vol = audioCtx.createGain();
  vol.gain.setValueAtTime(0.0001, t);
  vol.gain.exponentialRampToValueAtTime(0.2, t + 0.03);
  vol.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
  osc.connect(filtro);
  filtro.connect(vol);
  vol.connect(maestro);
  osc.start(t);
  osc.stop(t + 0.5);
}

function tocarPaso(t, n) {
  const segundos = t - inicio;
  const bar = Math.floor(n / 16);
  const acorde = ACORDES[bar % ACORDES.length];
  const enCompas = n % 16;

  /* Pulso grave: una nota por tiempo, siempre */
  if (n % 4 === 0) pulso(t, acorde[Math.floor(n / 4) % 3]);

  /* Cuerdas: al inicio de cada compás, desde los 10 s */
  if (enCompas === 0 && segundos > 10) pad(t, acorde, PASO * 16);

  /* Piano: notas sueltas del acorde, desde los 30 s */
  if (segundos > 30 && enCompas % 2 === 0) {
    piano(t, acorde[Math.floor(enCompas / 2) % 3], 0.09);
  }

  /* Bajo dramático, desde los 60 s */
  if (segundos > 60 && enCompas % 8 === 0) bajo(t, acorde[0]);

  /* Acorde de teatro (disminuido) como golpe, desde los 90 s */
  if (segundos > 90 && enCompas === 8 && bar % 4 === 3) {
    [0, 3, 6].forEach((s) => piano(t, s - 2, 0.12));
  }
}

function programar() {
  const hasta = audioCtx.currentTime + 0.3;
  while (siguiente < hasta) {
    tocarPaso(siguiente, paso16);
    paso16++;
    siguiente += PASO;
  }
}

async function alternarMusica() {
  if (!sonando) {
    try {
      if (!audioCtx) {
        audioCtx = new AC();
        maestro = audioCtx.createGain();
        maestro.gain.value = 0.9;
        maestro.connect(audioCtx.destination);
      }
      await audioCtx.resume();
      inicio = audioCtx.currentTime;
      siguiente = audioCtx.currentTime + 0.05;
      reloj = setInterval(programar, 100);
      sonando = true;
      botonMusica.textContent = "♪ Silenciar";
      botonMusica.setAttribute("aria-pressed", "true");
    } catch (err) {
      botonMusica.hidden = true;
    }
  } else {
    clearInterval(reloj);
    sonando = false;
    botonMusica.textContent = "♪ Música";
    botonMusica.setAttribute("aria-pressed", "false");
  }
}

if (AC) {
  botonMusica.addEventListener("click", alternarMusica);
} else {
  botonMusica.hidden = true;
}

/* ===== Pasarela: lomos de VHS que pasan; se pausa y se muestra la portada ===== */
const pista = $("pista");
const portadaSel = $("portada-sel");
const botonPausa = $("pausa");
const estadoCinta = $("estado-cinta");

function armarPista() {
  const orden = [...PELIS].sort((x, y) => x.t.localeCompare(y.t, "es"));
  pista.replaceChildren();
  [false, true].forEach((copia) => {
    orden.forEach((p) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "lomo";
      b.style.setProperty("--tono", ESTANTES[p.c] || "var(--blood)");
      if (p.p) {
        b.style.backgroundImage = 'url("' + p.p + '")';
        b.style.backgroundSize = "cover";
        b.style.backgroundPosition = "center";
      }
      const s = document.createElement("span");
      s.textContent = p.t;
      b.appendChild(s);
      /* Las dos copias responden al clic: la que se ve depende del momento del giro */
      b.addEventListener("click", () => seleccionar(p, b));
      if (copia) {
        b.tabIndex = -1;
        b.setAttribute("aria-hidden", "true");
      } else {
        b.setAttribute("aria-label", "Ver portada de " + p.t);
      }
      pista.appendChild(b);
    });
  });
  /* Un poco más de un segundo por lomo, para que se lea bien */
  pista.style.setProperty("--dur", (orden.length * 0.6) + "s");
}

function marcarPausa(on) {
  pista.classList.toggle("pausada", on);
  botonPausa.setAttribute("aria-pressed", on ? "true" : "false");
  botonPausa.textContent = on ? "▶ Play" : "❚❚ Pausa";
}

function seleccionar(p, lomo) {
  marcarPausa(true);
  estadoCinta.textContent = "Pausa · " + p.t;
  const cinta = crearCinta(p);
  /* La nota queda a la izquierda, ya desplegada; la portada a la derecha */
  const vista = document.createElement("div");
  vista.className = "vista";
  const nota = cinta.querySelector(".nota");
  vista.appendChild(cinta);
  if (nota) {
    nota.open = true;
    vista.appendChild(nota);
  }
  portadaSel.replaceChildren(vista);
  portadaSel.hidden = false;
  const sinMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!lomo || sinMovimiento || !lomo.animate) return;

  /* La cinta sale de la batea: se levanta del lomo y viaja hasta la portada */
  cinta.scrollIntoView({ block: "center" });
  const r = lomo.getBoundingClientRect();
  const f = cinta.getBoundingClientRect();
  if (!r.width || !f.width) return;
  const sx = r.width / f.width, sy = r.height / f.height;
  const saque = document.createElement("div");
  saque.className = "saque";
  saque.style.width = f.width + "px";
  saque.style.height = f.height + "px";
  saque.style.setProperty("--saque-img", p.p ? 'url("' + p.p + '")' : "none");
  saque.style.setProperty("--tono", ESTANTES[p.c] || "var(--blood)");
  saque.textContent = p.t;
  document.body.appendChild(saque);
  let anim;
  try {
    anim = saque.animate([
      { transform: `translate(${r.left}px, ${r.top}px) scale(${sx}, ${sy})` },
      { transform: `translate(${r.left}px, ${r.top - 40}px) scale(${sx}, ${sy})`, offset: 0.3 },
      { transform: `translate(${f.left}px, ${f.top}px) scale(1, 1)` }
    ], { duration: 850, easing: "cubic-bezier(.25,.7,.2,1)", fill: "forwards" });
  } catch (e) {
    /* Si la animación falla, la cinta queda visible igual */
    saque.remove();
    return;
  }
  portadaSel.style.visibility = "hidden";
  anim.onfinish = () => {
    saque.remove();
    portadaSel.style.visibility = "";
  };
}

function cerrarSeleccion() {
  portadaSel.hidden = true;
  portadaSel.replaceChildren();
  estadoCinta.textContent = "Play";
}

botonPausa.addEventListener("click", () => {
  const quedaPausada = !pista.classList.contains("pausada");
  marcarPausa(quedaPausada);
  if (quedaPausada) {
    estadoCinta.textContent = "Pausa";
  } else {
    cerrarSeleccion();
  }
});

armarPista();

inputBuscar.addEventListener("input", render);
render();
</script>
